version: '2'
image_name: ollama
docker_image: null
conda_env: ollama

apis:
- agents
- inference
- memory
- safety
- telemetry
- datasetio

providers:
  inference:
  - provider_id: ollama
    provider_type: remote::ollama
    config:
      url: ${env.OLLAMA_URL}
  - provider_id: sentence-transformers
    provider_type: inline::sentence-transformers
    config: {}

  memory:
  - provider_id: faiss
    provider_type: inline::faiss
    config:
      kvstore:
        type: sqlite
        namespace: null
        db_path: ${env.SQLITE_STORE_DIR}/faiss_store.db

  safety:
  - provider_id: llama-guard
    provider_type: inline::llama-guard
    config: {}

  agents:
  - provider_id: meta-reference
    provider_type: inline::meta-reference
    config:
      persistence_store:
        type: sqlite
        namespace: null
        db_path: ${env.SQLITE_STORE_DIR}/agents_store.db

  telemetry:
  - provider_id: meta-reference
    provider_type: inline::meta-reference
    config:
      service_name: llama-stack
      sinks: console
      sqlite_db_path: ${env.SQLITE_STORE_DIR}/trace_store.db
      deps:
        trace_store: null
        metric_store: null

  datasetio:
  - provider_id: localfs
    provider_type: inline::localfs
    config: {}

metadata_store:
  namespace: null
  type: sqlite
  db_path: ${env.SQLITE_STORE_DIR}/registry.db

models:
  - metadata: {}
    model_id: ${env.INFERENCE_MODEL}
    provider_id: ollama
    model_type: llm
  - metadata:
      embedding_dimension: 384
    model_id: all-MiniLM-L6-v2
    provider_id: sentence-transformers
    model_type: embedding

shields: []
memory_banks: []
datasets: []
scoring_fns: []
eval_tasks: []