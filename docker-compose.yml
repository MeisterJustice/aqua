version: "3.8"
services:
  stack:
    image: llamastack/distribution-together
    container_name: llama-stack
    environment:
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OTEL_SERVICE_NAME=llama-stack
      - TELEMETRY_SINKS=console,sqlite
      - SQLITE_STORE_DIR=/root/.llama/distributions/together
      - SQLITE_DB_PATH=/root/.llama/distributions/together/trace_store.db
    volumes:
      - stack_data:/root/.llama
    networks:
      - llama-network
    ports:
      - "5002:5000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5002/alpha/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  stack_data:
    name: llama_stack_data

networks:
  llama-network:
    name: llama_stack_network
    driver: bridge
